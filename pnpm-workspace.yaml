packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  prisma: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

overrides:
  multer: '>=2.3.0'
  postcss: '>=8.5.23'
  lodash: '>=4.17.24'
  js-yaml: '>=4.3.2'
  nanoid: '>=3.3.18'
  tar: '>=7.5.21'
  fast-uri: '>=3.1.6'
  brace-expansion: '>=5.0.9'
  deepmerge-ts: '>=8.0.0'
  file-type: '>=21.3.2'
  qs: '>=6.16.0'
  uuid: '>=11.1.1'
  ajv: '>=8.18.0'
  picomatch: '>=4.0.4'
  body-parser: '>=1.20.6'
  tmp: '>=0.2.6'
  webpack: '>=5.104.1'
  sharp: '>=0.35.4'
  next: '>=16.3.3'
  glob: '>=10.5.0'

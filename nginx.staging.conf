worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    # ── Upstream pools ───────────────────────────────────────────────────────
    # Docker Compose resolves "api" and "socket" as DNS service names.
    # With --scale api=4, Compose round-robins internally.

    upstream zayka_api {
        least_conn;
        server api:4000 fail_timeout=5s max_fails=3;
        keepalive 64;
    }

    upstream zayka_socket {
        # WebSocket connections need IP-hash or sticky sessions
        ip_hash;
        server socket:4001 fail_timeout=5s max_fails=3;
    }

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent $request_time '
                    '"$upstream_addr"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 1000;
    client_max_body_size 10m;
    gzip on;
    gzip_types application/json text/plain;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        server_name _;

        # ── Health (load balancer probe) ─────────────────────────────────────
        location = /api/v1/health {
            proxy_pass http://zayka_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── REST API ─────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=400 nodelay;
            limit_conn conn_limit 100;

            proxy_pass http://zayka_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ── Socket.IO (WebSocket upgrade) ───────────────────────────────────
        location /orders/ {
            proxy_pass http://zayka_socket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Long-lived WebSocket connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ── Socket.IO polling fallback ───────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://zayka_socket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}

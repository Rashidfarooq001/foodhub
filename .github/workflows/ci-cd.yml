name: FoodHub CI/CD Production Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Lint, Type-Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Monorepo Type-Check
        run: pnpm type-check

      - name: Generate Prisma Client
        run: pnpm --filter backend prisma:generate

      - name: Build Monorepo Bundles
        run: pnpm build

  docker-build:
    name: Build & Verify Production Containers
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: foodhub/backend:latest

      - name: Build Customer Web Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.customer
          push: false
          tags: foodhub/customer-web:latest
